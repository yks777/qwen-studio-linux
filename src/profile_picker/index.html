<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Studio - Seleção de Perfil</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>Qwen Studio</h1>
            <button id="create-btn" class="btn btn-primary" type="button">+ Criar perfil</button>
        </header>

        <form id="create-form">
            <input id="create-input" class="input" type="text" placeholder="Nome do perfil" required autocomplete="off" />
            <button id="create-confirm" type="submit" class="btn btn-primary btn-sm">Adicionar</button>
            <button id="create-cancel" type="button" class="btn btn-ghost btn-sm">Cancelar</button>
        </form>

        <div id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <p>Nenhum perfil encontrado.</p>
            <p class="empty-hint">Crie um novo perfil para começar.</p>
        </div>

        <div id="profile-list"></div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
