<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Studio - Seleção de Perfil</title>
    <style>
        html { background: #0f1115; }

        :root {
            --bg: #0f1115;
            --surface: #181b22;
            --surface-hover: #21252e;
            --border: #2b303b;
            --text: #e6e8ec;
            --text-muted: #9aa3b2;
            --accent: #6d4aff;
            --accent-hover: #5a3ae0;
            --danger: #e5484d;
            --danger-hover: #c93d42;
            --radius: 8px;
            --transition: 150ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px;
            line-height: 1.5;
        }

        .app-container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        #create-form {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            gap: 12px;
            animation: fadeIn 200ms ease;
        }

        #create-form.active { display: flex; }

        .input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 8px 12px;
            font-size: 0.9rem;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(109, 74, 255, 0.25);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }
        .btn-ghost:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .btn-danger {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }
        .btn-danger:hover {
            background: rgba(229, 72, 77, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        #profile-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            animation: fadeIn 250ms ease;
        }

        .profile-card:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #9b7aff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-name {
            font-weight: 500;
            font-size: 1rem;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .input-inline {
            background: var(--bg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--text);
            padding: 4px 8px;
            font-size: 1rem;
            width: 100%;
            max-width: 200px;
        }
        .input-inline:focus { outline: none; box-shadow: 0 0 0 2px rgba(109, 74, 255, 0.3); }

        #empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            color: var(--text-muted);
            animation: fadeIn 300ms ease;
        }

        #empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>Qwen Studio</h1>
            <button id="create-btn" class="btn btn-primary" type="button">+ Criar perfil</button>
        </header>

        <form id="create-form">
            <input id="create-input" class="input" type="text" placeholder="Nome do perfil" required autocomplete="off" />
            <button id="create-confirm" type="submit" class="btn btn-primary btn-sm">Adicionar</button>
            <button id="create-cancel" type="button" class="btn btn-ghost btn-sm">Cancelar</button>
        </form>

        <div id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <p>Nenhum perfil encontrado.</p>
            <p style="font-size: 0.875rem; margin-top: 4px;">Crie um novo perfil para começar.</p>
        </div>

        <div id="profile-list"></div>
    </div>

    <script>
        const invoke = window.__TAURI__.core.invoke;

        const listEl = document.getElementById("profile-list");
        const emptyEl = document.getElementById("empty-state");
        const createBtn = document.getElementById("create-btn");
        const createForm = document.getElementById("create-form");
        const createInput = document.getElementById("create-input");
        const createCancel = document.getElementById("create-cancel");

        function bootstrap() {
            loadProfiles();
            try {
                window.__TAURI__.window.getCurrentWindow().show();
            } catch (e) {}
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", bootstrap);
        } else {
            bootstrap();
        }

        async function loadProfiles() {
            try {
                const profiles = await invoke("list_profiles");
                renderProfiles(profiles || []);
            } catch (e) {
                console.error("Erro ao carregar perfis:", e);
                renderProfiles([]);
            }
        }

        function renderProfiles(profiles) {
            listEl.innerHTML = "";

            if (!profiles || profiles.length === 0) {
                emptyEl.style.display = "flex";
                return;
            }
            emptyEl.style.display = "none";

            for (const p of profiles) {
                const card = document.createElement("div");
                card.className = "profile-card";
                card.dataset.id = p.id;

                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.textContent = (p.name || "?").trim().charAt(0).toUpperCase() || "?";

                const info = document.createElement("div");
                info.className = "profile-info";
                const nameEl = document.createElement("span");
                nameEl.className = "profile-name";
                nameEl.textContent = p.name;
                nameEl.title = p.name;
                info.appendChild(nameEl);

                const actions = document.createElement("div");
                actions.className = "profile-actions";

                const enterBtn = document.createElement("button");
                enterBtn.className = "btn btn-primary btn-sm";
                enterBtn.textContent = "Entrar";
                enterBtn.addEventListener("click", () => launchProfile(p.id));

                const editBtn = document.createElement("button");
                editBtn.className = "btn btn-ghost btn-sm";
                editBtn.textContent = "Editar";
                editBtn.addEventListener("click", () => startRename(card, p));

                const delBtn = document.createElement("button");
                delBtn.className = "btn btn-danger btn-sm";
                delBtn.textContent = "Excluir";
                delBtn.addEventListener("click", () => deleteProfile(p.id));

                actions.append(enterBtn, editBtn, delBtn);
                card.append(avatar, info, actions);
                listEl.appendChild(card);
            }
        }

        function toggleCreateForm() {
            if (createForm.classList.contains("active")) {
                createForm.classList.remove("active");
                createBtn.style.display = "inline-flex";
                createInput.value = "";
            } else {
                createForm.classList.add("active");
                createBtn.style.display = "none";
                setTimeout(() => createInput.focus(), 50);
            }
        }

        async function handleCreate(e) {
            e.preventDefault();
            const name = createInput.value.trim();
            if (!name) return;

            try {
                await invoke("create_profile", { name });
                toggleCreateForm();
                await loadProfiles();
            } catch (err) {
                console.error("Erro ao criar perfil:", err);
                alert("Falha ao criar perfil.");
            }
        }

        function startRename(card, profile) {
            const info = card.querySelector(".profile-info");
            const actions = card.querySelector(".profile-actions");

            info.innerHTML = "";
            const input = document.createElement("input");
            input.className = "input-inline";
            input.id = "rename-input-" + profile.id;
            input.value = profile.name;
            info.appendChild(input);

            actions.innerHTML = "";
            const saveBtn = document.createElement("button");
            saveBtn.className = "btn btn-primary btn-sm";
            saveBtn.textContent = "Salvar";
            saveBtn.addEventListener("click", () => saveRename(profile.id));

            const cancelBtn = document.createElement("button");
            cancelBtn.className = "btn btn-ghost btn-sm";
            cancelBtn.textContent = "Cancelar";
            cancelBtn.addEventListener("click", loadProfiles);

            actions.append(saveBtn, cancelBtn);

            input.focus();
            input.select();
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    saveRename(profile.id);
                } else if (e.key === "Escape") {
                    e.preventDefault();
                    loadProfiles();
                }
            });
        }

        async function saveRename(id) {
            const input = document.getElementById("rename-input-" + id);
            if (!input) return;

            const newName = input.value.trim();
            if (!newName) return;

            try {
                await invoke("rename_profile", { id, name: newName });
                await loadProfiles();
            } catch (err) {
                console.error("Erro ao renomear perfil:", err);
                alert("Falha ao renomear perfil.");
            }
        }

        async function deleteProfile(id) {
            if (!window.confirm("Tem certeza que deseja excluir este perfil? Esta ação não pode ser desfeita.")) {
                return;
            }
            try {
                await invoke("delete_profile", { id });
                await loadProfiles();
            } catch (err) {
                console.error("Erro ao excluir perfil:", err);
                alert("Falha ao excluir perfil.");
            }
        }

        async function launchProfile(id) {
            try {
                await invoke("launch_profile", { id });
            } catch (err) {
                console.error("Erro ao lançar perfil:", err);
                alert("Falha ao abrir o perfil.");
            }
        }

        createBtn.addEventListener("click", toggleCreateForm);
        createCancel.addEventListener("click", toggleCreateForm);
        createForm.addEventListener("submit", handleCreate);
    </script>
</body>
</html>
